    } else if (sale) { title = "Ofertas"; crumbs = `<a href="#/tienda">Tienda</a> / <span>Ofertas</span>`; }
    setTitle(title);

    // búsqueda por texto (todas las palabras deben aparecer)
    const words = norm(query).split(/\s+/).filter(Boolean);
    const score = new Map();
    if (words.length) {
      base = base.filter((p) => words.every((w) => p._search.includes(w)));
      base.forEach((p) => score.set(p, words.reduce((s, w) => s + (norm(p.nombre).includes(w) ? 3 : 0) + (norm(p.ref).includes(w) ? 5 : 0), 0)));
      title = cat || group || sale ? title : `“${query}”`;
    }
    if (f.oferta) base = base.filter((p) => p.onSale);

    // facetas (se calculan sobre la base, antes de los filtros de talla/color/precio)
    const facetCats = !cat ? Catalog.categories.filter((c) => (!group || c.grupo === group)).map((c) => ({ c, n: base.filter((p) => p.categoria_id === c.id).length })).filter((x) => x.n) : [];
    const tallas = [...new Set(base.flatMap((p) => p.sizeList))].sort((a, b) => Catalog.sizeRank(a) - Catalog.sizeRank(b));
    const colores = new Map(); base.forEach((p) => p.colorList.forEach((c) => { if (!colores.has(c.nombre)) colores.set(c.nombre, c.hex); }));

    let list = base.filter((p) =>
      (!f.cats.length || f.cats.includes(p.categoria_id)) &&
      (!f.tallas.length || p.variantes.some((v) => f.tallas.includes(v.talla) && (v.stock == null || v.stock > 0 || !f.disp))) &&
      (!f.colores.length || p.colorList.some((c) => f.colores.includes(c.nombre))) &&
      (!f.disp || p.inStock) &&
      (f.min === "" || (p.minPrice != null && p.minPrice >= Number(f.min))) &&
      (f.max === "" || (p.minPrice != null && p.minPrice <= Number(f.max))));

    const sorters = {
      relevancia: (a, b) => (words.length ? (score.get(b) - score.get(a)) : 0) || relevance(a, b),
      nuevos: newest,
      "precio-asc": (a, b) => (a.minPrice ?? Infinity) - (b.minPrice ?? Infinity) || relevance(a, b),
      "precio-desc": (a, b) => (b.minPrice ?? -1) - (a.minPrice ?? -1) || relevance(a, b),
      nombre: (a, b) => a.nombre.localeCompare(b.nombre, "es"),
    };
    list = [...list].sort(sorters[f.orden] || sorters.relevancia);

    const key = location.hash;
    if (shopState.key !== key) { shopState.key = key; shopState.shown = PAGE; }
    const shown = list.slice(0, shopState.shown);

    const params = () => ({ q: query, cat: cat ? "" : f.cats, talla: f.tallas, color: f.colores, min: f.min, max: f.max, disp: f.disp ? "1" : "", oferta: !sale && f.oferta ? "1" : "", orden: f.orden === "relevancia" ? "" : f.orden });
    const toggle = (arrName, val) => { const p = params(); const a = new Set(p[arrName]); a.has(val) ? a.delete(val) : a.add(val); p[arrName] = [...a]; setQuery(p); };

    const filtersHtml = `
      ${facetCats.length > 1 ? `<div class="fgroup"><h4>Categoría</h4><div class="flist">${facetCats.map(({ c, n }) => `<button data-f="cat" data-v="${esc(c.id)}" class="${f.cats.includes(c.id) ? "is-on" : ""}"><span>${esc(c.nombre)}</span><small>${n}</small></button>`).join("")}</div></div>` : ""}
      ${tallas.length > 1 ? `<div class="fgroup"><h4>Talla</h4><div class="fopts">${tallas.map((t) => `<button class="fopt ${f.tallas.includes(t) ? "is-on" : ""}" data-f="talla" data-v="${esc(t)}">${esc(t)}</button>`).join("")}</div></div>` : ""}
      ${colores.size > 1 ? `<div class="fgroup"><h4>Color</h4><div class="fopts">${[...colores].map(([n, h]) => `<button class="fopt fopt--color ${f.colores.includes(n) ? "is-on" : ""}" data-f="color" data-v="${esc(n)}"><i style="background:${esc(h)}"></i>${esc(n)}</button>`).join("")}</div></div>` : ""}
      <div class="fgroup"><h4>Precio</h4><form class="prange" data-price><input class="input" type="number" inputmode="numeric" min="0" step="1000" name="min" placeholder="Mín" value="${esc(f.min)}" aria-label="Precio mínimo"><input class="input" type="number" inputmode="numeric" min="0" step="1000" name="max" placeholder="Máx" value="${esc(f.max)}" aria-label="Precio máximo"><button class="sr">Aplicar</button></form></div>
      <div class="fgroup"><h4>Disponibilidad</h4>
        <label class="check"><input type="checkbox" data-f="disp" ${f.disp ? "checked" : ""}> Solo disponibles</label>
        ${!sale && P.some((p) => p.onSale) ? `<label class="check" style="margin-top:8px"><input type="checkbox" data-f="oferta" ${f.oferta ? "checked" : ""}> Solo ofertas</label>` : ""}
      </div>`;

    const chipsActive = [
      ...(!cat ? f.cats.map((c) => ["cat", c, (Catalog.cat(c) || {}).nombre || c]) : []),
      ...f.tallas.map((t) => ["talla", t, "Talla " + t]), ...f.colores.map((c) => ["color", c, c]),
      ...(f.min ? [["min", "", "Desde " + money(+f.min)]] : []), ...(f.max ? [["max", "", "Hasta " + money(+f.max)]] : []),
      ...(f.disp ? [["disp", "", "Disponibles"]] : []), ...(!sale && f.oferta ? [["oferta", "", "Ofertas"]] : []),
      ...(query ? [["q", "", "Búsqueda: " + query]] : []),
    ];

    const catChips = cat && catObj ? Catalog.categories.filter((c) => c.grupo === catObj.grupo && P.some((p) => p.categoria_id === c.id)) : group ? Catalog.categories.filter((c) => c.grupo === group && P.some((p) => p.categoria_id === c.id)) : [];

    app.innerHTML = `<div class="wrap">
      <div class="page-head">${crumbs ? `<div class="crumbs">${crumbs}</div>` : ""}<h1>${esc(title)}</h1><p>${list.length} ${list.length === 1 ? "producto" : "productos"}${words.length ? ` para “${esc(query)}”` : ""}</p></div>
      ${catChips.length > 1 ? `<div class="chips">${group ? `<a class="chip is-on" href="#/grupo/${group}">Todo</a>` : `<a class="chip" href="#/grupo/${catObj.grupo}">Todo</a>`}${catChips.map((c) => `<a class="chip ${c.id === cat ? "is-on" : ""}" href="#/categoria/${esc(c.id)}">${esc(c.nombre)}</a>`).join("")}</div>` : ""}
      <div class="shop">
        <aside class="filters" aria-label="Filtros">${filtersHtml}</aside>
        <div>
          <div class="toolbar">
            <div class="toolbar__l"><button class="btn btn--ghost btn--sm btn-filters" id="open-filters">${icon("filter")} Filtros${chipsActive.length ? ` (${chipsActive.length})` : ""}</button></div>
            <label class="toolbar__l"><span class="small muted">Ordenar</span>
              <select class="select" id="sort">${[["relevancia", "Relevancia"], ["nuevos", "Más nuevos"], ["precio-asc", "Menor precio"], ["precio-desc", "Mayor precio"], ["nombre", "Nombre A–Z"]].map(([v, l]) => `<option value="${v}" ${f.orden === v ? "selected" : ""}>${l}</option>`).join("")}</select></label>
          </div>
          ${chipsActive.length ? `<div class="active-filters">${chipsActive.map(([k, v, l]) => `<button data-rm="${k}" data-v="${esc(v)}">${esc(l)} ${icon("x")}</button>`).join("")}<button data-clear class="link" style="border:0;background:none">Limpiar todo</button></div>` : ""}
          ${list.length ? grid(shown) : `<div class="empty"><h3>No encontramos productos</h3><p>Prueba con otra búsqueda o quita algunos filtros.</p>${chipsActive.length ? '<button class="btn btn--ghost" data-clear>Quitar filtros</button>' : '<a class="btn" href="#/tienda">Ver toda la tienda</a>'}</div>`}
          ${list.length > shown.length ? `<div class="more"><span class="small muted">Mostrando ${shown.length} de ${list.length}</span><button class="btn btn--ghost" id="more">Ver más productos</button></div>` : ""}
        </div>
      </div></div>`;
    $("#filters-body").innerHTML = filtersHtml;

    const onFilterClick = (e) => {
      const b = e.target.closest("[data-f]");
      if (b && b.tagName === "BUTTON") {
        const k = b.dataset.f, v = b.dataset.v;
        if (k === "cat") toggle("cat", v); else if (k === "talla") toggle("talla", v); else if (k === "color") toggle("color", v);
      }
    };
    const onFilterChange = (e) => {
      const i = e.target.closest("input[data-f]"); if (!i) return;
      const p = params(); p[i.dataset.f] = i.checked ? "1" : ""; setQuery(p);
    };
    const onPrice = (e) => { const fm = e.target.closest("[data-price]"); if (!fm) return; e.preventDefault(); const p = params(); p.min = fm.min.value; p.max = fm.max.value; setQuery(p); };
    [app, $("#filters-body")].forEach((root) => {
      root.addEventListener("click", onFilterClick); root.addEventListener("change", onFilterChange); root.addEventListener("submit", onPrice);
      root.addEventListener("focusout", (e) => { if (e.target.closest("[data-price]") && e.target.value !== f[e.target.name]) onPrice({ target: e.target, preventDefault() {} }); });
      cleanup.push(() => { root.removeEventListener("click", onFilterClick); root.removeEventListener("change", onFilterChange); root.removeEventListener("submit", onPrice); });
    });
    $("#sort").onchange = (e) => { const p = params(); p.orden = e.target.value === "relevancia" ? "" : e.target.value; setQuery(p); };
    $("#open-filters") && ($("#open-filters").onclick = () => drawer($("#filters"), true));
    $$("[data-rm]", app).forEach((b) => b.onclick = () => {
      const k = b.dataset.rm, v = b.dataset.v, p = params();
      if (["cat", "talla", "color"].includes(k)) p[k] = p[k].filter((x) => x !== v); else p[k] = "";
      setQuery(p);
    });
    $$("[data-clear]", app).forEach((b) => b.onclick = () => setQuery({}));
    const more = $("#more"); if (more) more.onclick = () => { shopState.shown += PAGE; const y = window.scrollY; render(); window.scrollTo(0, y); };
  }

  /* ---------------- producto ---------------- */
  function viewProduct(slug) {
    const p = Catalog.bySlug.get(slug);
    if (!p) return view404("Este producto no existe o ya no está disponible.");
    setTitle(p.nombre);
    const cat = Catalog.cat(p.categoria_id);
    const S = { color: null, talla: null, qty: 1, img: 0 };
    const colorVariants = (c) => p.variantes.filter((v) => !p.colorList.length || v.color === c);
    const colorAvail = (c) => colorVariants(c).some((v) => v.stock == null || v.stock > 0);
    S.color = p.colorList.length ? (p.colorList.find((c) => colorAvail(c.nombre)) || p.colorList[0]).nombre : null;
    const sel = () => p.variantes.find((v) => (S.color == null || v.color === S.color) && v.talla === S.talla) || null;
    const autoSize = () => { const vs = colorVariants(S.color); const av = vs.filter((v) => v.stock == null || v.stock > 0); S.talla = vs.length === 1 && av.length === 1 ? vs[0].talla : (vs.some((v) => v.talla === S.talla && (v.stock == null || v.stock > 0)) ? S.talla : null); };
    autoSize();

    const st = Catalog.settings;
    const envioTxt = st.envio_costo == null || st.envio_costo === "" ? "El valor del envío se confirma por WhatsApp según tu ciudad." :
      `Envío: ${Number(st.envio_costo) === 0 ? "gratis" : money(Number(st.envio_costo))}${st.envio_gratis_desde ? `. Gratis en compras desde ${money(Number(st.envio_gratis_desde))}.` : "."}`;
    const related = Catalog.products.filter((x) => x !== p && x.categoria_id === p.categoria_id).sort(relevance).slice(0, 8);
    const guide = p.guia_tallas ? (/[/.]/.test(p.guia_tallas) ? p.guia_tallas : `catalogo/guias/${p.guia_tallas}.jpg`) : "";

    app.innerHTML = `<div class="wrap">
      <div class="crumbs" style="padding-top:16px"><a href="#/tienda">Tienda</a>${cat ? ` / <a href="#/categoria/${esc(cat.id)}">${esc(cat.nombre)}</a>` : ""} / <span>${esc(p.nombre)}</span></div>
      <div class="pdp">
        <div class="gallery" id="gallery"></div>
        <div class="pinfo" id="pinfo"></div>
      </div>
      ${related.length ? `<section class="section"><div class="section__head"><h2>También te puede gustar</h2>${cat ? `<a href="#/categoria/${esc(cat.id)}">Ver ${esc(cat.nombre)}</a>` : ""}</div>${grid(related)}</section>` : ""}
    </div>
    <div class="pdp-bar" id="pdp-bar"></div>`;

    const paintGallery = () => {
      const ims = Catalog.imagesFor(p, S.color);
      const g = $("#gallery");
      if (!ims.length) { g.innerHTML = '<div class="gallery__main"><div class="gallery__track"></div></div>'; return; }
      S.img = Math.min(S.img, ims.length - 1);
      g.innerHTML = `
        <div class="gallery__thumbs">${ims.map((im, i) => `<button data-i="${i}" class="${i === S.img ? "is-on" : ""}" aria-label="Foto ${i + 1}"><img src="${esc(Catalog.thumb(im.src))}" alt="" loading="lazy"></button>`).join("")}</div>
        <div class="gallery__main">
          <div class="gallery__track" id="track">${ims.map((im, i) => `<img src="${esc(im.src)}" alt="${esc(p.nombre)}${im.color ? " — " + esc(im.color) : ""}" ${i ? 'loading="lazy"' : 'fetchpriority="high"'} decoding="async">`).join("")}</div>
          ${ims.length > 1 ? `<button class="gallery__arrow gallery__arrow--l" data-step="-1" aria-label="Foto anterior">${icon("left")}</button><button class="gallery__arrow gallery__arrow--r" data-step="1" aria-label="Foto siguiente">${icon("right")}</button>
          <div class="gallery__dots">${ims.map((_, i) => `<i class="${i === S.img ? "is-on" : ""}"></i>`).join("")}</div>` : ""}
        </div>`;
      const track = $("#track");
      const goImg = (i, smooth = true) => { S.img = (i + ims.length) % ims.length; track.scrollTo({ left: track.clientWidth * S.img, behavior: smooth ? "smooth" : "auto" }); mark(); };
      const mark = () => { $$(".gallery__thumbs button", g).forEach((b, i) => b.classList.toggle("is-on", i === S.img)); $$(".gallery__dots i", g).forEach((d, i) => d.classList.toggle("is-on", i === S.img)); };
      $$(".gallery__thumbs button", g).forEach((b) => b.onclick = () => goImg(+b.dataset.i));
      $$("[data-step]", g).forEach((b) => b.onclick = () => goImg(S.img + +b.dataset.step));
      track.addEventListener("scroll", debounce(() => { const i = Math.round(track.scrollLeft / Math.max(1, track.clientWidth)); if (i !== S.img) { S.img = i; mark(); } }, 60), { passive: true });
      requestAnimationFrame(() => goImg(S.img, false));
    };

    const paintInfo = () => {
      const v = sel();
      const vs = colorVariants(S.color);
      const sizes = [...new Set(vs.map((x) => x.talla))].sort((a, b) => Catalog.sizeRank(a) - Catalog.sizeRank(b));
      const price = Catalog.priceOf(p, v || vs[0]);
      const buyable = p.purchasable && p.variantes.length && p.inStock;
      const max = v ? (v.stock == null ? 20 : Math.min(v.stock, 20)) : 20;
      S.qty = Math.max(1, Math.min(S.qty, max));
      let stockLine = "";
      if (!p.variantes.length || !p.inStock) stockLine = '<div class="stockline is-out">Agotado</div>';
      else if (v && v.stock === 0) stockLine = '<div class="stockline is-out">Agotado en esta talla</div>';
      else if (v && v.stock != null && v.stock <= 3) stockLine = `<div class="stockline is-low">${v.stock === 1 ? "¡Última unidad!" : `Últimas ${v.stock} unidades`}</div>`;
      else if (v) stockLine = '<div class="stockline">Disponible</div>';

      $("#pinfo").innerHTML = `
        <div>
          ${p.ref ? `<div class="eyebrow" style="margin-bottom:8px">Ref. ${esc(p.ref)}</div>` : ""}
          <h1>${esc(p.nombre)}</h1>
          <div style="margin-top:12px;display:flex;gap:10px;align-items:center;flex-wrap:wrap">${priceHtml(p, v || (price != null && vs.length ? vs[0] : null))}${p.onSale ? `<span class="badge badge--sale">-${p.pct}%</span>` : ""}</div>
        </div>
        ${p.colorList.length ? `<div class="opt"><h3>Color <span>${esc(S.color || "")}</span></h3><div class="swatches">${p.colorList.map((c) => `<button class="swatch ${c.nombre === S.color ? "is-on" : ""} ${colorAvail(c.nombre) ? "" : "is-out"}" data-color="${esc(c.nombre)}" aria-pressed="${c.nombre === S.color}"><i style="background:${esc(c.hex)}"></i>${esc(c.nombre)}${colorAvail(c.nombre) ? "" : " (agotado)"}</button>`).join("")}</div></div>` : ""}
        ${sizes.length && !(sizes.length === 1 && sizes[0] === "Única") ? `<div class="opt"><h3>Talla ${guide ? `<button class="link small" id="guide" style="letter-spacing:0;text-transform:none">${icon("ruler")} Guía de tallas</button>` : ""}</h3>
          <div class="sizes">${sizes.map((t) => { const x = vs.find((y) => y.talla === t); const out = x && x.stock === 0; return `<button class="size ${t === S.talla ? "is-on" : ""}" data-size="${esc(t)}" ${out ? 'disabled title="Agotada"' : ""} aria-pressed="${t === S.talla}">${esc(t)}</button>`; }).join("")}</div>
          <p class="small muted" id="size-msg" style="margin-top:8px">${S.talla ? "" : "Elige una talla"}</p></div>` : sizes.length ? `<p class="small muted">Talla única</p>` : ""}
        ${stockLine}
        ${buyable ? `
          <div class="buy" id="buy-main">
            <div class="qty" aria-label="Cantidad"><button data-q="-1" ${S.qty <= 1 ? "disabled" : ""} aria-label="Menos">−</button><span>${S.qty}</span><button data-q="1" ${S.qty >= max ? "disabled" : ""} aria-label="Más">+</button></div>
            <button class="btn" id="add" ${v && v.stock === 0 ? "disabled" : ""}>Agregar al carrito</button>
          </div>
          <div class="buy2"><button class="btn btn--ghost" id="buynow" ${v && v.stock === 0 ? "disabled" : ""}>Comprar ahora</button></div>`
        : !p.purchasable && p.inStock ? `
          <div class="notice notice--info">El precio de este producto se consulta directamente con la tienda.</div>
          <a class="btn btn--wa" id="ask" target="_blank" rel="noopener" href="#">${WA_SVG.replace("<svg", '<svg width="20" height="20" fill="#fff"')} Consultar precio por WhatsApp</a>`
        : `<div class="notice">Este producto está agotado por ahora.</div>
          <a class="btn btn--ghost" id="ask" target="_blank" rel="noopener" href="#">Preguntar por disponibilidad</a>`}
        <div class="acc">
          ${p.descripcion ? `<details open><summary>Descripción</summary><div class="acc__body">${esc(p.descripcion)}</div></details>` : ""}
          <details><summary>Envío y pago</summary><div class="acc__body">${esc(envioTxt)}
Pago contraentrega o por transferencia bancaria.
Tu pedido se registra en la tienda y lo confirmas por WhatsApp.</div></details>
        </div>`;

      const pi = $("#pinfo");
      $$("[data-color]", pi).forEach((b) => b.onclick = () => { S.color = b.dataset.color; S.img = 0; autoSize(); paintInfo(); paintGallery(); });
      $$("[data-size]", pi).forEach((b) => b.onclick = () => { S.talla = b.dataset.size; paintInfo(); });
      $$("[data-q]", pi).forEach((b) => b.onclick = () => { S.qty += +b.dataset.q; paintInfo(); });
      const g = $("#guide", pi); if (g) g.onclick = () => window.WB.modal({ title: "Guía de tallas", body: `<img class="guide" src="${esc(guide)}" alt="Guía de tallas">`, wide: true });
      const ask = $("#ask", pi); if (ask) ask.href = waLink(`Hola, quiero consultar ${p.purchasable ? "la disponibilidad" : "el precio"} de: ${p.nombre}${p.ref ? " (Ref. " + p.ref + ")" : ""}${S.color ? " · Color " + S.color : ""}${S.talla && S.talla !== "Única" ? " · Talla " + S.talla : ""}.\n${location.href}`);
      const add = (then) => {
        const v2 = sel();
        if (!v2) { const m = $("#size-msg"); if (m) { m.textContent = "Elige una talla para continuar"; m.style.color = "var(--err)"; m.scrollIntoView({ block: "center", behavior: "smooth" }); } else toast("Elige una opción", "err"); return; }
        const added = Cart.add(v2.id, S.qty);
        if (!added) { toast(v2.stock != null ? `Ya tienes en el carrito todas las unidades disponibles (${v2.stock}).` : "Ya tienes la cantidad máxima en el carrito.", "err"); return; }
        if (then === "checkout") go("#/checkout");
        else { paintCart(); drawer($("#cart"), true); }
      };
      const a = $("#add", pi); if (a) a.onclick = () => add();
      const bn = $("#buynow", pi); if (bn) bn.onclick = () => add("checkout");

      const bar = $("#pdp-bar");
      if (buyable) {
        bar.innerHTML = `<div style="min-width:0"><div class="small" style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:40vw">${esc(p.nombre)}</div>${priceHtml(p, v)}</div><button class="btn" id="bar-add">${S.talla ? "Agregar al carrito" : "Elegir talla"}</button>`;
        $("#bar-add").onclick = () => { if (!sel()) { $("#pinfo .sizes") && $("#pinfo .sizes").scrollIntoView({ block: "center", behavior: "smooth" }); add(); } else add(); };
      } else bar.innerHTML = "";
    };

    paintGallery(); paintInfo();
    const bm = () => $("#buy-main") || $("#pinfo .btn");
    if ("IntersectionObserver" in window && bm()) {
      const io = new IntersectionObserver(([e]) => { const on = !e.isIntersecting && e.boundingClientRect.top < 0 && !!$("#pdp-bar").innerHTML; $("#pdp-bar").classList.toggle("is-on", on); document.body.classList.toggle("has-bar", on); });
      io.observe($("#pinfo")); cleanup.push(() => io.disconnect());
    }
  }

  /* ---------------- favoritos ---------------- */
  function viewFavs() {
    setTitle("Favoritos");
    const list = Favs.all().map((id) => Catalog.byId.get(id)).filter(Boolean);
    app.innerHTML = `<div class="wrap"><div class="page-head"><h1>Favoritos</h1><p>Se guardan en este dispositivo y navegador.</p></div>
      ${list.length ? grid(list) : `<div class="empty">${icon("heart")}<h3>Aún no tienes favoritos</h3><p>Toca el corazón en cualquier producto para guardarlo aquí.</p><a class="btn" href="#/tienda">Explorar la tienda</a></div>`}<div style="height:60px"></div></div>`;
  }

  /* ---------------- carrito (drawer) ---------------- */
  function paintCart() {
    const s = Cart.summary();
    const body = $("#cart-body"), foot = $("#cart-foot");
    if (!s.lines.length) {
      body.innerHTML = `<div class="empty">${icon("bag")}<h3>Tu carrito está vacío</h3><p>Agrega productos para hacer tu pedido.</p></div>`;
      foot.innerHTML = `<a class="btn btn--block" href="#/tienda" data-dclose>Ir a la tienda</a>`;
      return;
    }
    const prog = s.costo != null && s.costo > 0 && s.gratis ? (s.subtotal >= s.gratis
      ? `<div class="ship-progress"><b>¡Tienes envío gratis!</b><div class="bar"><i style="width:100%"></i></div></div>`
      : `<div class="ship-progress">Te faltan <b>${money(s.gratis - s.subtotal)}</b> para envío gratis<div class="bar"><i style="width:${Math.min(100, (s.subtotal / s.gratis) * 100)}%"></i></div></div>`) : "";
    body.innerHTML = prog + s.lines.map((l) => l.missing ? `
      <div class="citem"><div style="width:76px;height:95px" class="skel"></div><div><div class="citem__warn">${esc(l.problem)}</div><button class="rm" data-rm="${esc(l.vid)}">Quitar</button></div></div>` : `
      <div class="citem">
        <a href="#/producto/${esc(l.p.slug)}" data-dclose><img src="${esc(Catalog.thumb(Catalog.img(l.p, l.v.color)))}" alt=""></a>
        <div>
          <div class="citem__top"><div><a class="citem__name" href="#/producto/${esc(l.p.slug)}" data-dclose>${esc(l.p.nombre)}</a>
            <div class="citem__meta">${l.v.talla !== "Única" ? "Talla " + esc(l.v.talla) : "Talla única"}${l.v.color ? " · " + esc(l.v.color) : ""}</div></div>
            <b style="white-space:nowrap">${l.price != null ? money(l.total) : ""}</b></div>
          ${l.problem ? `<div class="citem__warn">${esc(l.problem)}</div>` : ""}
          <div class="citem__bot">
            ${l.max > 0 && l.price != null ? `<div class="qty qty--sm"><button data-cq="${esc(l.vid)}" data-d="-1" ${l.qty <= 1 ? "disabled" : ""} aria-label="Menos">−</button><span>${l.qty}</span><button data-cq="${esc(l.vid)}" data-d="1" ${l.qty >= l.max ? "disabled" : ""} aria-label="Más">+</button></div>` : "<span></span>"}
            <button class="rm" data-rm="${esc(l.vid)}">Quitar</button>
          </div>
        </div>
      </div>`).join("");
    foot.innerHTML = `
      ${s.hasProblems ? `<div class="notice notice--err small">Hay productos que no se pueden pedir. <button class="link" id="fix-cart">Ajustar carrito</button></div>` : ""}
      <div class="sumrow"><span>Subtotal</span><b>${money(s.subtotal)}</b></div>
      <div class="sumrow small muted"><span>Envío</span><span>${s.envio == null ? "Se confirma por WhatsApp" : s.envio === 0 ? "Gratis" : money(s.envio)}</span></div>
      <a class="btn btn--block ${!s.ok.length || s.hasProblems ? "is-disabled" : ""}" href="#/checkout" data-dclose>Finalizar pedido</a>
      <button class="btn btn--ghost btn--block" data-dclose>Seguir comprando</button>`;
    const fix = $("#fix-cart"); if (fix) fix.onclick = fixCart;
  }
  function fixCart() {
    Cart.lines().forEach((l) => { if (l.missing || l.price == null || l.max === 0) Cart.remove(l.vid); else if (l.qty > l.max) Cart.setQty(l.vid, l.max); });
    toast("Carrito ajustado a lo disponible");
  }
  $("#cart").addEventListener("click", (e) => {
    const q = e.target.closest("[data-cq]"); if (q) { const l = Cart.lines().find((x) => String(x.vid) === q.dataset.cq); if (l) Cart.setQty(l.vid, Math.max(1, Math.min(l.max, l.qty + +q.dataset.d))); return; }
    const r = e.target.closest("[data-rm]"); if (r) { Cart.remove(r.dataset.rm); }
  });

  /* ---------------- checkout ---------------- */
  const CO = { metodo: null, key: null };
  function viewCheckout(q) {
    setTitle("Finalizar pedido");
    const s = Cart.summary();
    if (!s.lines.length) { app.innerHTML = `<div class="wrap empty" style="padding:90px 16px">${icon("bag")}<h2>Tu carrito está vacío</h2><p>Agrega productos antes de finalizar tu pedido.</p><a class="btn" href="#/tienda">Ir a la tienda</a></div>`; return; }
    let step = Math.max(1, Math.min(3, +(q.get("paso") || 1)));
    const data = store.get("wb_customer_tmp", null) || store.get("wb_customer", null) || {};
    const valid1 = validateCustomer(data).ok;
    if (step > 1 && !valid1) step = 1;
    if (step > 2 && !CO.metodo) step = 2;
    const st = Catalog.settings;

    const summaryHtml = `<aside class="co-sum card-box"><h2>Tu pedido</h2>
      <div class="lines">${s.lines.filter((l) => !l.missing).map((l) => `<div class="co-line"><img src="${esc(Catalog.thumb(Catalog.img(l.p, l.v.color)))}" alt=""><div><b>${esc(l.p.nombre)}</b><span class="muted">${l.v.talla !== "Única" ? "Talla " + esc(l.v.talla) + " · " : ""}${l.v.color ? esc(l.v.color) + " · " : ""}x${l.qty}</span>${l.problem ? `<div class="citem__warn">${esc(l.problem)}</div>` : ""}</div><b>${l.price != null ? money(l.total) : ""}</b></div>`).join("")}</div>
      <div class="rows">
        <div class="sumrow"><span>Subtotal</span><b>${money(s.subtotal)}</b></div>
        <div class="sumrow"><span>Envío</span><span>${s.envio == null ? "Se confirma por WhatsApp" : s.envio === 0 ? "Gratis" : money(s.envio)}</span></div>
        <div class="sumrow sumrow--total"><span>Total</span><span>${money(s.total)}${s.envio == null ? '<small class="muted" style="font:500 12px var(--f-body)"> + envío</small>' : ""}</span></div>
      </div></aside>`;

    const steps = `<ol class="costeps">${["Datos", "Pago", "Revisión"].map((t, i) => `<li class="${i + 1 === step ? "is-on" : i + 1 < step ? "is-done" : ""}">${i + 1}. ${t}</li>`).join("")}</ol>`;
    const blocked = "";
    const problems = s.hasProblems ? `<div class="notice notice--err" style="margin-bottom:16px">Algunos productos de tu carrito ya no están disponibles en la cantidad elegida. <button class="link" id="co-fix">Ajustar carrito</button></div>` : "";

    let main = "";
    if (step === 1) {
      main = `<form class="card-box co-form" id="f1" novalidate><h2>Datos de entrega</h2>
        <p class="small muted" style="margin-top:-8px">No necesitas crear una cuenta.</p>
        <div class="field"><label for="c-nombre">Nombre completo</label><input class="input" id="c-nombre" name="nombre" autocomplete="name" required maxlength="80" value="${esc(data.nombre || "")}"></div>
        <div class="field"><label for="c-tel">Teléfono / WhatsApp</label><input class="input" id="c-tel" name="telefono" type="tel" inputmode="tel" autocomplete="tel" required maxlength="20" placeholder="300 123 4567" value="${esc(data.telefono || "")}"></div>
        <div class="grid2">
          <div class="field"><label for="c-ciudad">Ciudad / municipio</label><input class="input" id="c-ciudad" name="ciudad" autocomplete="address-level2" required maxlength="60" value="${esc(data.ciudad || "")}"></div>
          <div class="field"><label for="c-barrio">Barrio</label><input class="input" id="c-barrio" name="barrio" required maxlength="80" value="${esc(data.barrio || "")}"></div>
        </div>
        <div class="field"><label for="c-dir">Dirección</label><input class="input" id="c-dir" name="direccion" autocomplete="street-address" required maxlength="160" placeholder="Calle, carrera, número, apto/casa" value="${esc(data.direccion || "")}"></div>
        <div class="field"><label for="c-notas">Información adicional <span class="muted" style="text-transform:none;letter-spacing:0;font-weight:500">(opcional)</span></label><textarea class="textarea" id="c-notas" name="notas" maxlength="400" placeholder="Puntos de referencia, horario de entrega…">${esc(data.notas || "")}</textarea></div>
        <label class="check"><input type="checkbox" name="recordar" ${store.get("wb_customer", null) ? "checked" : ""}> Recordar mis datos en este dispositivo</label>
        <div class="co-actions"><a class="btn btn--ghost" href="#/tienda">Seguir comprando</a><button class="btn">Continuar al pago</button></div>
      </form>`;
    } else if (step === 2) {
      const opt = (k, t, d) => `<label><input type="radio" name="metodo" value="${k}" ${CO.metodo === k ? "checked" : ""}><span><b>${t}</b><p>${esc(d)}</p></span></label>`;
      main = `<form class="card-box" id="f2"><h2>Forma de pago</h2>
        <div class="pay">
          ${opt("contraentrega", "Pago contraentrega", st.pago_contraentrega || "Pagas al recibir tu pedido.")}
          ${opt("transferencia", "Transferencia bancaria", st.pago_transferencia || "Te enviamos los datos para transferir por WhatsApp.")}
        </div>
        <p class="small muted" style="margin-top:12px">No se realizan cobros en línea en esta página.</p>
        <p class="small" id="pay-err" style="color:var(--err);font-weight:600;margin-top:8px" hidden>Elige una forma de pago.</p>
        <div class="co-actions"><a class="btn btn--ghost" href="#/checkout?paso=1">Volver</a><button class="btn">Revisar pedido</button></div>
      </form>`;
    } else {
      main = `<div class="card-box"><h2>Revisa y confirma</h2>
        <div class="review">
          <section><h3>Entrega <button data-goto="1">Editar</button></h3>
            <p><b>${esc(data.nombre)}</b> · ${esc(data.telefono)}</p><p>${esc(data.direccion)}, ${esc(data.barrio)}, ${esc(data.ciudad)}</p>${data.notas ? `<p class="muted small" style="margin-top:4px">${esc(data.notas)}</p>` : ""}</section>
          <section><h3>Pago <button data-goto="2">Editar</button></h3><p>${esc(METODOS[CO.metodo])}</p></section>
          <section><h3>Productos <button data-open-cart>Editar</button></h3>
            ${s.ok.map((l) => `<p>${l.qty} × ${esc(l.p.nombre)} <span class="muted">(${l.v.talla !== "Única" ? "Talla " + esc(l.v.talla) : "Única"}${l.v.color ? ", " + esc(l.v.color) : ""})</span> — <b>${money(l.total)}</b></p>`).join("")}
          </section>
        </div>
        <div class="notice notice--info small" style="margin-top:16px">Al tocar el botón se abre <b>WhatsApp</b> con tu pedido completo. El pedido se confirma en el chat (disponibilidad, envío y pago).</div>
        <div id="co-err"></div>
        <div class="co-actions"><a class="btn btn--ghost" href="#/checkout?paso=2">Volver</a><button class="btn btn--wa" id="confirm" ${s.hasProblems || !s.ok.length ? "disabled" : ""}>Enviar pedido por WhatsApp</button></div>
      </div>`;
    }

    app.innerHTML = `<div class="wrap"><div class="page-head"><h1>Finalizar pedido</h1></div>${blocked}${problems}<div class="co"><div>${steps}${main}</div>${summaryHtml}</div></div>`;
    const cf = $("#co-fix"); if (cf) cf.onclick = () => { fixCart(); render(); };

    if (step === 1) {
      const f = $("#f1");
      const save = () => { const d = formData(f); store.set("wb_customer_tmp", d); if (f.recordar.checked) store.set("wb_customer", d); else store.del("wb_customer"); return d; };
      f.addEventListener("input", debounce(save, 300));
      f.onsubmit = (e) => {
        e.preventDefault(); const d = save(); const v = validateCustomer(d);
        $$(".field .error", f).forEach((x) => x.remove()); $$(".is-invalid", f).forEach((x) => x.classList.remove("is-invalid"));
        if (!v.ok) {
          Object.entries(v.errors).forEach(([k, m]) => { const i = f[k]; i.classList.add("is-invalid"); i.insertAdjacentHTML("afterend", `<span class="error">${esc(m)}</span>`); });
          f[Object.keys(v.errors)[0]].focus(); return;
        }
        go("#/checkout?paso=2");
      };
    } else if (step === 2) {
      const f = $("#f2");
      f.onchange = () => { CO.metodo = f.metodo.value; $("#pay-err").hidden = true; };
      f.onsubmit = (e) => { e.preventDefault(); if (!f.metodo.value) { $("#pay-err").hidden = false; return; } CO.metodo = f.metodo.value; go("#/checkout?paso=3"); };
    } else {
      $$("[data-goto]").forEach((b) => b.onclick = () => go("#/checkout?paso=" + b.dataset.goto));
      $("[data-open-cart]").onclick = () => { paintCart(); drawer($("#cart"), true); };
      $("#confirm").onclick = () => submitOrder(data);
    }
  }
  const formData = (f) => Object.fromEntries(["nombre", "telefono", "ciudad", "barrio", "direccion", "notas"].map((k) => [k, (f[k].value || "").trim()]));
  function validateCustomer(d) {
    const e = {};
    if ((d.nombre || "").trim().length < 2) e.nombre = "Escribe tu nombre.";
    const tel = (d.telefono || "").replace(/\D/g, "");
    if (tel.length < 7 || tel.length > 15) e.telefono = "Escribe un teléfono válido (ej. 300 123 4567).";
    if ((d.ciudad || "").trim().length < 2) e.ciudad = "Escribe la ciudad.";
    if ((d.barrio || "").trim().length < 2) e.barrio = "Escribe el barrio.";
    if ((d.direccion || "").trim().length < 4) e.direccion = "Escribe la dirección completa.";
    return { ok: !Object.keys(e).length, errors: e };
  }

  function submitOrder(data) {
    const s = Cart.summary();
    if (!s.ok.length || s.hasProblems) return;
    const order = window.WB.Orders.create(data, CO.metodo, s);
    // Se abre WhatsApp en el mismo clic (si se hace después, el navegador lo bloquea).
    window.open(waLink(orderMessage(order)), "_blank", "noopener");
    Cart.clear(); CO.metodo = null; store.del("wb_customer_tmp");
    go("#/pedido/" + encodeURIComponent(order.numero));
  }

  /* ---------------- confirmación ---------------- */
  function viewOrderDone(numero) {
    const o = store.get("wb_orders", []).find((x) => x.numero === numero);
    setTitle("Pedido " + numero);
    if (!o) return view404("No encontramos ese pedido en este dispositivo.");
    const c = o.cliente || {}; const st = Catalog.settings;
    const wa = waLink(orderMessage(o));
    const payTxt = o.metodo_pago === "transferencia" ? st.pago_transferencia : st.pago_contraentrega;
    app.innerHTML = `<div class="wrap"><div class="done">
      <div class="done__head">
        <div class="done__check">${icon("check")}</div>
        <span class="eyebrow">Pedido listo</span>
        <div class="done__num">${esc(o.numero)}</div>
        <p class="muted">Gracias, ${esc((c.nombre || "").split(" ")[0])}. Tu pedido se confirma por WhatsApp: allí te confirmamos disponibilidad, envío y pago.</p>
      </div>
      <div class="wa-box">
        <h2>Envía el mensaje en WhatsApp</h2>
        <p class="small muted">Abrimos WhatsApp con el detalle completo de tu pedido. Solo falta tocar <b>Enviar</b> en el chat. Si no se abrió, usa este botón:</p>
        <a class="btn btn--wa btn--block" id="wa-send" href="${esc(wa)}" target="_blank" rel="noopener">${WA_SVG.replace("<svg", '<svg width="22" height="22" fill="#fff"')} Enviar pedido por WhatsApp</a>
        <p class="small muted" id="wa-help">¿No se abrió? Escríbenos al <a class="link" href="${esc(waLink(""))}" target="_blank" rel="noopener">${esc(window.WB.waPretty())}</a> con tu número de pedido <b>${esc(o.numero)}</b>.</p>
      </div>
      <div class="card-box">
        <h2>Resumen</h2>
        <div class="lines" style="display:grid;gap:12px;margin-bottom:14px">${o.items.map((it) => `<div class="co-line"><img src="${esc(Catalog.thumb(it.imagen || ""))}" alt=""><div><b>${esc(it.nombre)}</b><span class="muted">${it.talla !== "Única" ? "Talla " + esc(it.talla) + " · " : ""}${it.color ? esc(it.color) + " · " : ""}x${it.cantidad}</span></div><b>${money(it.subtotal ?? it.precio_unitario * it.cantidad)}</b></div>`).join("")}</div>
        <div class="rows" style="display:grid;gap:8px">
          <div class="sumrow"><span>Subtotal</span><b>${money(o.subtotal)}</b></div>
          <div class="sumrow"><span>Envío</span><span>${o.envio == null ? "Se confirma por WhatsApp" : o.envio === 0 ? "Gratis" : money(o.envio)}</span></div>
          <div class="sumrow sumrow--total"><span>Total</span><span>${money(o.total)}${o.envio == null ? '<small class="muted" style="font:500 12px var(--f-body)"> + envío</small>' : ""}</span></div>
        </div>
      </div>
      <div class="card-box review">
        <section><h3>Entrega</h3><p><b>${esc(c.nombre)}</b> · ${esc(c.telefono)}</p><p>${esc(c.direccion)}, ${esc(c.barrio)}, ${esc(c.ciudad)}</p>${c.notas ? `<p class="small muted">${esc(c.notas)}</p>` : ""}</section>
        <section><h3>Pago</h3><p><b>${esc(METODOS[o.metodo_pago])}</b></p>${payTxt ? `<p class="small muted" style="white-space:pre-line">${esc(payTxt)}</p>` : ""}</section>
      </div>
      <div style="display:flex;gap:10px;flex-wrap:wrap;justify-content:center">
        <a class="btn" href="#/tienda">Seguir comprando</a>
      </div>
    </div></div>`;
    $("#wa-send").addEventListener("click", () => { $("#wa-help").innerHTML = `¿Ya lo enviaste? ¡Listo! Si WhatsApp no se abrió, escríbenos al <a class="link" href="${esc(waLink(""))}" target="_blank" rel="noopener">${esc(window.WB.waPretty())}</a> indicando el pedido <b>${esc(o.numero)}</b>.`; });
  }

  function view404(msg) {
    setTitle("No encontrado");
    app.innerHTML = `<div class="wrap empty" style="padding:100px 16px"><h2>Página no encontrada</h2><p>${esc(msg || "La dirección no existe.")}</p><a class="btn" href="#/tienda">Ir a la tienda</a></div>`;
  }
  function renderLoadError() {
    app.innerHTML = `<div class="wrap empty" style="padding:100px 16px"><h2>No pudimos cargar la tienda</h2><p>${esc(loadError)}</p><button class="btn" id="retry">Reintentar</button></div>`;
    $("#retry").onclick = boot;
  }

  /* ---------------- búsqueda ---------------- */
  const searchEl = $("#search"), sInput = $("#search-input"), sRes = $("#search-res");
  const paintSearch = () => {
    const words = norm(sInput.value).split(/\s+/).filter(Boolean);
    if (!words.length) {
      sRes.innerHTML = `<p class="eyebrow" style="margin-bottom:12px">Categorías</p><div class="chips" style="flex-wrap:wrap">${Catalog.categories.filter((c) => Catalog.products.some((p) => p.categoria_id === c.id)).map((c) => `<a class="chip" href="#/categoria/${esc(c.id)}">${esc(c.nombre)}</a>`).join("")}</div>`;
      return;
    }
    const hits = Catalog.products.filter((p) => words.every((w) => p._search.includes(w))).sort(relevance);
    sRes.innerHTML = hits.length ? `<div class="search__list">${hits.slice(0, 12).map((p) => `<a class="search__item" href="#/producto/${esc(p.slug)}"><img src="${esc(Catalog.thumb(Catalog.img(p)))}" alt="" loading="lazy"><span><b>${esc(p.nombre)}</b>${priceHtml(p)}</span></a>`).join("")}</div>
      ${hits.length > 12 ? `<p style="margin-top:16px"><a class="btn btn--ghost" href="#/tienda?q=${encodeURIComponent(sInput.value.trim())}">Ver los ${hits.length} resultados</a></p>` : ""}` : `<p class="muted">Sin resultados para “${esc(sInput.value)}”.</p>`;
  };
  sInput.addEventListener("input", debounce(paintSearch, 120));
  $("#search-form").onsubmit = (e) => { e.preventDefault(); const v = sInput.value.trim(); if (v) go("#/tienda?q=" + encodeURIComponent(v)); };
  $("#btn-search").onclick = () => { if (!Catalog.ready) return; paintSearch(); drawer(searchEl, true); setTimeout(() => sInput.focus(), 60); };

  /* ---------------- chrome ---------------- */
  $("#btn-cart").onclick = () => { paintCart(); drawer($("#cart"), true); };
  $("#btn-menu").onclick = () => drawer($("#menu"), true);
  $("#scrim").onclick = () => $$(".drawer.is-open,.search.is-open").forEach((d) => drawer(d, false));
  document.addEventListener("click", (e) => {
    if (e.target.closest("[data-dclose]")) { const d = e.target.closest(".drawer,.search"); if (d) drawer(d, false); }
    const fav = e.target.closest("[data-fav]");
    if (fav) { e.preventDefault(); const on = Favs.toggle(fav.dataset.fav); $$(`[data-fav="${CSS.escape(fav.dataset.fav)}"]`).forEach((b) => { b.classList.toggle("is-on", on); b.setAttribute("aria-pressed", on); }); toast(on ? "Guardado en favoritos" : "Quitado de favoritos", "", on ? { href: "#/favoritos", label: "Ver" } : null); }
    const anc = e.target.closest("[data-anchor]"); if (anc) { e.preventDefault(); const t = document.querySelector(anc.getAttribute("href")); t && t.scrollIntoView({ behavior: "smooth" }); }
  });
  document.addEventListener("keydown", (e) => { if (e.key === "Escape") $$(".drawer.is-open,.search.is-open").forEach((d) => drawer(d, false)); });
  const paintCounts = () => {
    const c = Cart.count(), f = Favs.all().length;
    $("#cart-count").textContent = c; $("#cart-count").hidden = !c;
    $("#fav-count").textContent = f; $("#fav-count").hidden = !f;
  };
  document.addEventListener("cart:change", () => { paintCounts(); if ($("#cart").classList.contains("is-open")) paintCart(); if (parseHash().path === "/checkout") render(); });
  document.addEventListener("favs:change", () => { paintCounts(); if (parseHash().path === "/favoritos") render(); });
  window.addEventListener("storage", (e) => { if (e.key === "wb_cart" || e.key === "wb_favs") { paintCounts(); } });
  window.addEventListener("scroll", () => $("#nav").classList.toggle("is-scrolled", window.scrollY > 4), { passive: true });

  function paintChrome() {
    const st = Catalog.settings;
    $("#preview-bar").hidden = !Catalog.draft;
    const an = $("#announce"); an.textContent = st.anuncio || ""; an.hidden = !st.anuncio;
    $("#nav-ofertas").hidden = !Catalog.products.some((p) => p.onSale);
    const wa = $("#wa-float"); wa.href = waLink("Hola WESNOCK, quiero hacer una consulta."); wa.innerHTML = WA_SVG;
    const groups = Object.keys(GROUPS).map((g) => ({ g, cats: Catalog.categories.filter((c) => c.grupo === g && Catalog.products.some((p) => p.categoria_id === c.id)) })).filter((x) => x.cats.length);
    const others = Catalog.categories.filter((c) => !GROUPS[c.grupo] && Catalog.products.some((p) => p.categoria_id === c.id));
    $("#menu-body").innerHTML = `
      <div class="mmenu__group mmenu__main"><a href="#/tienda" data-dclose>Tienda</a>${groups.map(({ g }) => `<a href="#/grupo/${g}" data-dclose>${GROUPS[g].nombre}</a>`).join("")}${Catalog.products.some((p) => p.onSale) ? '<a href="#/ofertas" data-dclose>Ofertas</a>' : ""}</div>
      ${groups.map(({ g, cats }) => `<div class="mmenu__group"><h3>${GROUPS[g].nombre}</h3>${cats.map((c) => `<a href="#/categoria/${esc(c.id)}" data-dclose>${esc(c.nombre)} ${icon("right")}</a>`).join("")}</div>`).join("")}
      ${others.length ? `<div class="mmenu__group"><h3>Más</h3>${others.map((c) => `<a href="#/categoria/${esc(c.id)}" data-dclose>${esc(c.nombre)} ${icon("right")}</a>`).join("")}</div>` : ""}
      <div class="mmenu__group"><h3>Ayuda</h3><a href="#/favoritos" data-dclose>Favoritos ${icon("right")}</a><a href="${esc(waLink("Hola WESNOCK, quiero hacer una consulta."))}" target="_blank" rel="noopener">WhatsApp ${icon("right")}</a></div>`;
    const pretty = window.WB.waPretty();
    $("#foot").innerHTML = `<div class="wrap">
      <div class="foot__grid">
        <div><span class="wordmark">WESNOCK</span><p style="max-width:300px;font-size:14px">Ropa, calzado y accesorios. Pedidos en línea con confirmación por WhatsApp.</p></div>
        <div><h4>Tienda</h4><a href="#/tienda">Todo</a>${groups.map(({ g }) => `<a href="#/grupo/${g}">${GROUPS[g].nombre}</a>`).join("")}</div>
        <div><h4>Ayuda</h4><a href="#/" data-home-how>Cómo comprar</a><a href="#/favoritos">Favoritos</a></div>
        <div><h4>Contacto</h4><a href="${esc(waLink("Hola WESNOCK, quiero hacer una consulta."))}" target="_blank" rel="noopener">WhatsApp ${esc(pretty)}</a>${st.instagram ? `<a href="https://instagram.com/${esc(String(st.instagram).replace(/^@/, ""))}" target="_blank" rel="noopener">Instagram @${esc(String(st.instagram).replace(/^@/, ""))}</a>` : ""}</div>
      </div>
      <div class="foot__bottom"><span>© ${new Date().getFullYear()} WESNOCK</span><span>Pedidos por WhatsApp</span></div>
    </div>`;
    const how = $("[data-home-how]"); how.onclick = (e) => { e.preventDefault(); go("#/"); setTimeout(() => { const t = $("#como-comprar"); t && t.scrollIntoView({ behavior: "smooth" }); }, 60); };
    paintCounts();
  }

  /* ---------------- arranque ---------------- */
  async function boot() {
    loadError = null;
    
    try { Catalog.load(); paintChrome(); }
    catch (e) { loadError = friendly(e); }
    render();
  }
  window.addEventListener("hashchange", render);
  // Refresca stock y precios al volver a la pestaña (si pasaron más de 3 minutos).
  window.WBStore = { render, reload: () => { Catalog.load(); paintChrome(); } };
  boot();
})();

  }
  </script>
</body>
